[workspace]
members = [
    "crates/rho-agent",
    "crates/rho-ai",
    "crates/rho-ai-anthropic",
    "crates/rho-ai-openai",
    "crates/rho-cli",
    "crates/rho-codec-jsonl",
    "crates/rho-core",
    "crates/rho-ext",
    "crates/rho-ext-wasm",
    "crates/rho-rpc",
    "crates/rho-shelterwood",
    "crates/rho-store",
    "crates/rho-tools",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"

# The flake reads `name` to label Nix derivations.
[workspace.metadata]
name = "rho"

[workspace.dependencies]
anyhow = "1.0.100"
async-stream = "0.3.6"
base64 = "0.22.1"
futures-core = "0.3.31"
futures-util = "0.3.31"
jiff = { version = "0.2.35", default-features = false, features = ["std"] }
jsonschema = { version = "0.49.2", default-features = false }
nanocodex-oai-api = { git = "https://github.com/gakonst/nanocodex.git", rev = "e2f1effb4f6047d374aa0f83e374f919f7d1b241" }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
rustls = { version = "0.23.43", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
rho-agent = { path = "crates/rho-agent" }
rho-ai = { path = "crates/rho-ai" }
rho-ai-anthropic = { path = "crates/rho-ai-anthropic" }
rho-ai-openai = { path = "crates/rho-ai-openai" }
rho-codec-jsonl = { path = "crates/rho-codec-jsonl" }
rho-core = { path = "crates/rho-core" }
rho-ext = { path = "crates/rho-ext" }
rho-ext-wasm = { path = "crates/rho-ext-wasm" }
rho-rpc = { path = "crates/rho-rpc" }
rho-shelterwood = { path = "crates/rho-shelterwood" }
rho-store = { path = "crates/rho-store" }
rho-tools = { path = "crates/rho-tools" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
shelterwood = { git = "https://github.com/ralexstokes/shelterwood.git", rev = "02d2f236ac6f29dacf1dce5bd72c72b4bbdf790b" }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1.24.0", features = ["v7"] }
webpki-root-certs = "1.0.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
